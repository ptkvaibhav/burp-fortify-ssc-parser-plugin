name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    # setup-gradle also validates the checksum of gradle-wrapper.jar.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    # `build` compiles, runs tests, Checkstyle (main + test), JaCoCo and builds the shaded plugin jar.
    - name: Build, Test & Lint
      run: ./gradlew build

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/html/

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v7
      with:
        name: burp-fortify-ssc-parser-plugin
        path: |
          build/libs/burp-fortify-ssc-parser-plugin-*.jar
          !build/libs/*-plain.jar
        if-no-files-found: error
